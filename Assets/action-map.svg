<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">ScreenSort keyboard actions</title><desc id="desc">Default keys: D to move an item to Trash, Space to skip, Z to undo, and F for a folder action.</desc>
<rect width="1200" height="250" rx="28" fill="#171923"/><text x="600" y="48" text-anchor="middle" fill="#dce5ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="700">Default actions · configurable in Settings</text>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
<g fill="#242a3b" stroke="#75a6ff" stroke-width="2"><rect x="70" y="82" width="230" height="112" rx="16"/><rect x="350" y="82" width="230" height="112" rx="16"/><rect x="630" y="82" width="230" height="112" rx="16"/><rect x="910" y="82" width="220" height="112" rx="16"/></g>
<g fill="#78a9ff" font-size="28" font-weight="700"><text x="185" y="128">D</text><text x="465" y="128">Space</text><text x="745" y="128">Z</text><text x="1020" y="128">F</text></g>
<g fill="#f4f6fc" font-size="16"><text x="185" y="164">Move to Trash</text><text x="465" y="164">Skip</text><text x="745" y="164">Undo</text><text x="1020" y="164">Folder action</text></g></g></svg>
