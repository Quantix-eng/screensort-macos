<g fill="#242a3b" stroke="#75a6ff" stroke-width="2">
<rect x="55" y="105" width="235" height="145" rx="18"/><rect x="345" y="105" width="235" height="145" rx="18"/><rect x="635" y="105" width="235" height="145" rx="18"/><rect x="925" y="105" width="220" height="145" rx="18"/>
</g>
