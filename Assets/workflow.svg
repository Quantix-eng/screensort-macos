<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">ScreenSort workflow</title><desc id="desc">Choose a folder and file types, review matching items, then keep, move, or send them to Trash.</desc>
